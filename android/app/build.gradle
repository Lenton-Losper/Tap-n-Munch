apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"

// DantSu's ESCPOS-ThermalPrinter-Android is published via JitPack, not Maven Central/Google.
repositories {
    maven { url 'https://jitpack.io' }
    // Wiseasy SDK6 (WiseSdk6PrinterModule.kt) ships as local AARs, not a Maven artifact.
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Bluetooth ESC/POS transport for PrinterModule.kt (receipt printing).
    implementation("com.github.DantSu:ESCPOS-ThermalPrinter-Android:3.3.0")

    // Wiseasy SDK6 for the P5's built-in printer (WiseSdk6PrinterModule.kt). "P" is the POS SDK
    // (WisePosSdk, printer access); "D" is the device SDK it binds alongside during init,
    // matching the SDK6 demo app's own MainActivity.onCreate() sequence.
    implementation(name: 'WiseSdk_P_1.29_00a_24041501', ext: 'aar')
    implementation(name: 'WiseSdk_D_1.09_00a_24032501', ext: 'aar')

    // Wiseasy SDK4 base binder — the printer transport that actually resolves on our P5 units
    // (WiseSdk4PrinterModule.kt). Printing ONLY: the Emv, KeyManager and emvprocess jars from
    // the same package are deliberately NOT included, since using SDK4 for payments would make
    // FlashTap the payment application instead of calling WiseCashier.
    implementation files('libs/SDK4BaseBinderV2.2.29.jar')

    // JVM unit tests for the dependency-free layout arithmetic in ReceiptColumnLayout.kt.
    // Receipt truncation is invisible from SDK return codes (#166), so the proportion maths
    // is the only part that can be checked without a P5 in hand.
    testImplementation("junit:junit:4.13.2")
}
