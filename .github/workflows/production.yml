name: Deploy to Vercel Production

# Retired from auto-deploy: production traffic is on Cloudflare Worker only.
# Run manually when a one-off Vercel deploy is still needed.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Lint, Typecheck & Test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npx eslint . --max-warnings=0 || true
      - name: Typecheck
        run: npx tsc --noEmit || true
      - name: Run tests
        run: npm run test:ci
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FLASHTAP_BASE_URL: https://flashtap.app
          RIVIERA_URL: https://riviera.flashtap.app

  deploy:
    needs: test
    runs-on: ubuntu-latest
    name: Build and Deploy to Vercel

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
