name: Deploy flashtap-production Worker

on:
  workflow_dispatch:
    inputs:
      skip_verification:
        description: 'EMERGENCY ONLY: deploy without Lint/Typecheck/unit tests. The choice is recorded in the run log.'
        type: boolean
        default: false
        required: false

jobs:
  # Issue #141: production had no Lint/Typecheck/unit-test gate while staging.yml did, so
  # production was the LESS verified path. ~80 TS2339 errors deployed to production from `main`
  # and were only caught on the way to staging.
  staging-health:
    # WHY THIS GATE EXISTS, and why it is HERE rather than on the staging workflow.
    #
    # The staging pipeline is build-verification -> deploy -> verify, and `verify` is DEPLOYMENT
    # verification: it drives the deployed worker. It therefore cannot gate the deploy it verifies
    # without being circular. Asking it to was the obvious answer and it is not available.
    #
    # What actually caused harm on 2026-08-24 was not staging serving a broken banner -- staging is
    # a test environment and that is survivable. It was PROMOTING that code to production while the
    # staging E2E had been red for twelve consecutive runs, naming the exact defect, on the exact
    # commit that caused it. The signal existed and nothing consumed it. This consumes it.
    #
    # Deliberately "the latest staging run", not "the run for this commit": a promotion to main is a
    # cherry-pick and carries a DIFFERENT sha, so a per-commit lookup would match nothing and pass
    # vacuously -- which is the failure mode this whole gate exists to stop.
    if: ${{ inputs.skip_verification != true }}
    runs-on: ubuntu-latest
    name: Staging Health (last staging run must be green)
    steps:
      - name: Refuse to promote from a red staging
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=staging.yml                   --limit 1 --json databaseId,conclusion,headSha,status)
          echo "latest staging run: $RUN"
          CONC=$(echo "$RUN" | jq -r '.[0].conclusion // "none"')
          STAT=$(echo "$RUN" | jq -r '.[0].status // "none"')
          SHA=$(echo "$RUN"  | jq -r '.[0].headSha // "none"')
          if [ "$STAT" != "completed" ]; then
            echo "STAGING HEALTH: the latest staging run is '$STAT', not completed."
            echo "Wait for it, or dispatch with skip_verification if this is an emergency."
            exit 1
          fi
          if [ "$CONC" != "success" ]; then
            echo "STAGING HEALTH: FAILED -- latest staging run ($SHA) concluded '$CONC'."
            echo ""
            echo "Production is not promoted from a staging that has not verified. On 2026-08-24"
            echo "twelve deploys shipped over a red E2E that named the exact live defect, and the"
            echo "code reached production anyway. That is what this refuses."
            echo ""
            echo "Fix staging, or dispatch with skip_verification=true -- which is recorded here."
            exit 1
          fi
          echo "STAGING HEALTH: OK -- latest staging run ($SHA) is green."


  build-verification:
    # The override exists because this workflow is the only route to production. If `main` goes
    # red for an unrelated reason, an urgent hotfix must still be shippable. Defaults to false,
    # and the choice is visible in the run log via the step below.
    if: ${{ inputs.skip_verification != true }}
    runs-on: ubuntu-latest
    name: Build Verification (Lint, Typecheck, Unit Tests)
    steps:
      # Mirrors the guard on the deploy job below so a wrong-ref dispatch fails before it
      # installs anything. The deploy job keeps its own copy: when this job is skipped via
      # the override, that copy is the only thing enforcing main-only. Keep both in step.
      - name: Require main branch ref
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "ERROR: Production deploy must be triggered from main only."
            echo "Got ref: ${{ github.ref }}"
            exit 1
          fi
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
      # Runs before `npm ci` so node_modules cannot pollute the scan.
      # #142: conflict markers sat in a JSDoc block for days because neither the build nor
      # typecheck could see them. Catches a class of error typecheck structurally cannot.
      - name: Reject committed conflict markers
        run: |
          set -euo pipefail
          if grep -rnE '^(<<<<<<<|>>>>>>>)' app lib components workers; then
            echo "ERROR: merge conflict markers are committed (listed above)."
            exit 1
          fi
          echo "No conflict markers found."
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npx eslint . --max-warnings=0
      - name: Typecheck
        run: npx tsc --noEmit
      # "Order #0" has reached production THREE times, in three different files, each time
      # because a render site asked "does this order have a number?" itself instead of asking
      # hasAllocatedOrderNumber(). `!= null` and `typeof === 'number'` both admit 0, and an
      # order_request carries order_number as an empty string, which Number() turns into 0.
      # Static: no credentials, no database. BLOCKING — the tree is clean as of 2026-08-19, so
      # this can only fail on something NEW.
      - name: Every order-number test goes through hasAllocatedOrderNumber
        run: npx tsx scripts/check-order-number-guard.ts

      # Static: no credentials, no database. BLOCKING - the tree is clean as of 2026-08-20, so
      # this can only fail on something NEW. Self-tests its own detectors before reporting.
      - name: Every session-restaurant lookup goes through resolveSessionRestaurantId
        run: npx tsx scripts/check-session-restaurant-resolver.ts

      # Static: no credentials, no database. BLOCKING - the tree is clean as of 2026-08-20.
      # Self-tests its own detectors, including the stored-builder and generic-argument cases that
      # produced false positives in earlier drafts.
      - name: Every read of orders is ranged, narrowed, or paginated
        run: npx tsx scripts/check-orders-read-bounded.ts
      # #172: `@ts-nocheck` hides a file from `tsc --noEmit` entirely, and the gate exists
      # because a TS2339 reached production -- exactly the class the pragma suppresses. This does
      # NOT fix the nine existing files; it makes the set a ratchet so no NEW one appears.
      - name: No new @ts-nocheck files
        run: node scripts/check-ts-nocheck-baseline.mjs
      # #212: an inline CHECK on `ADD COLUMN IF NOT EXISTS` is silently skipped
      # when the column already exists — the migration succeeds and the
      # constraint is never created, so the ledger and the database disagree in
      # a way nothing downstream can detect. Static, no credentials, no database;
      # the five existing offenders are baselined inside the script, so this can
      # only fail on a newly committed migration.
      - name: Reject inline CHECK on ADD COLUMN IF NOT EXISTS
        run: npx tsx scripts/check-migration-inline-check.ts
      # A `PENDING COPY` marker reached production and the owner of a multi-location account read
      # `PENDING COPY — Location` above the switcher on all twenty staff screens (2026-08-21).
      #
      # FOUR PENDING COPY CHECKS ALREADY EXISTED AND NONE COULD HAVE CAUGHT IT. Each was written at
      # the moment its own string was signed off and pins that string only:
      # order-alert-copy-signed-off reads components/orders-dashboard.tsx; customer-status-vocabulary
      # asserts on CUSTOMER_STATUS_COPY; no-invented-order-number on one key; menu-item-requires-tax-rate
      # on one constant. A file created afterwards was invisible to all four, and the convention
      # itself was documented in a header telling the reader to `git grep` by hand.
      #
      # HERE AND NOT IN staging.yml ON PURPOSE. Shipping a placeholder to staging IS the workflow --
      # mark it, build the screen, get the wording signed off, then promote. This blocks the one
      # door that matters without breaking how the work gets done.
      - name: No PENDING COPY in shippable source
        run: node scripts/check-no-pending-copy.mjs
      # Deliberately NOT staging.yml's "Unit and schema tests" step. That step passes the
      # UNPREFIXED SUPABASE_* secrets, which in this repo are the PRODUCTION ones (see the
      # migration-drift step below, which uses the same names against the production DB), and
      # the suites behind it are live-data assertions rather than unit tests. Copying it here
      # would point a test suite at the production database on every deploy, and would make a
      # customer-facing deploy fail on data drift. Only hermetic suites run here; they need no
      # network and no credentials.
      # `migration-inline-check` is here rather than left to the CLI step above
      # because the step above cannot detect its own blindness: if the parser
      # ever regresses to a line-oriented match it exits 0 and reports a clean
      # sheet, which is indistinguishable from there being nothing to find.
      # These tests are what notice. Hermetic — no network, no credentials.
      - name: Unit tests (hermetic, no database)
        run: npx jest --ci --forceExit --testPathPattern="capabilities|table-close-payment-safety|production-deploy-gate|migration-inline-check"

  deploy:
    needs: [build-verification, staging-health]
    # A skipped `needs:` dependency skips the dependent job by default, so without this the
    # emergency override would deploy nothing instead of deploying unverified. `!cancelled()`
    # rather than `always()` so a cancelled run does not still deploy.
    if: ${{ !cancelled()
      && (needs.build-verification.result == 'success' || needs.build-verification.result == 'skipped')
      && (needs.staging-health.result == 'success' || needs.staging-health.result == 'skipped') }}
    runs-on: ubuntu-latest
    name: Build and Deploy flashtap-production
    steps:
      - name: Record verification status
        run: |
          echo "skip_verification input: ${{ inputs.skip_verification }}"
          echo "build-verification result: ${{ needs.build-verification.result }}"
          if [ "${{ needs.build-verification.result }}" = "skipped" ]; then
            echo "::warning::UNVERIFIED PRODUCTION DEPLOY - Lint/Typecheck/unit tests were skipped via the skip_verification input."
          fi
      - name: Require main branch ref
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "ERROR: Production deploy must be triggered from main only."
            echo "Got ref: ${{ github.ref }}"
            exit 1
          fi
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build with OpenNext
        run: npx @opennextjs/cloudflare@1.20.1 build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: https://flashtap.app
          NEXT_PUBLIC_BASE_URL: https://flashtap.app
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
          GIT_COMMIT_SHA: ${{ github.sha }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - name: Assert production custom domains in wrangler.production.toml
        run: |
          set -euo pipefail
          for pattern in 'flashtap.app' 'www.flashtap.app' 'riviera.flashtap.app'; do
            if ! grep -Fq "pattern = \"$pattern\"" wrangler.production.toml; then
              echo "MISSING wrangler custom domain route: $pattern"
              exit 1
            fi
          done
          echo "wrangler.production.toml custom domain routes OK"
      - name: Check migration drift (production DB vs supabase/migrations)
        run: node scripts/check-migration-drift.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Deploy to flashtap-production
        run: npx wrangler@3.99.0 deploy --config wrangler.production.toml --var GIT_COMMIT_SHA:${{ github.sha }} --var NEXT_PUBLIC_COMMIT_SHA:${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_SHADOW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Set Cloudflare worker secrets
        run: |
          if [ -n "$CRON_SECRET" ]; then
            echo "$CRON_SECRET" | npx wrangler@3.99.0 secret put CRON_SECRET --config wrangler.production.toml
          else
            echo "WARNING: PRODUCTION_CRON_SECRET not set — expire-pending will 401 until configured"
          fi
          if [ -n "$TERMINAL_JWT_SECRET" ]; then
            echo "$TERMINAL_JWT_SECRET" | npx wrangler@3.99.0 secret put TERMINAL_JWT_SECRET --config wrangler.production.toml
          else
            echo "WARNING: PRODUCTION_TERMINAL_JWT_SECRET not set — terminal activation will fail"
          fi
          if [ -n "$RESEND_API_KEY" ]; then
            echo "RESEND_API_KEY length in deploy: ${#RESEND_API_KEY}"
            echo "$RESEND_API_KEY" | npx wrangler@3.99.0 secret put RESEND_API_KEY --config wrangler.production.toml
          else
            echo "WARNING: PRODUCTION_RESEND_API_KEY not set — staff invite emails will not send"
          fi
          # #266: this was set out of band, so the Worker was not reproducible from the repo.
          # Unlike the three above, a missing value here does NOT surface as a broken feature:
          # createServerSupabaseClient() falls back to the anon key (lib/supabase/server.ts), so
          # every server route would silently run as `anon` under RLS instead of service_role.
          # A warning nobody reads is how this drifted in the first place — fail the job.
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "ERROR: SUPABASE_SERVICE_ROLE_KEY is empty — server routes would silently fall back to the anon key."
            exit 1
          fi
          echo "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler@3.99.0 secret put SUPABASE_SERVICE_ROLE_KEY --config wrangler.production.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_SHADOW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CRON_SECRET: ${{ secrets.PRODUCTION_CRON_SECRET }}
          TERMINAL_JWT_SECRET: ${{ secrets.PRODUCTION_TERMINAL_JWT_SECRET }}
          RESEND_API_KEY: ${{ secrets.PRODUCTION_RESEND_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
