name: Upsert Staging Platform Admin

# One-shot helper: create/reset a staging auth user and grant super_admin.
# Do not leave passwords in logs. Prefer deleting this workflow after use.
on:
  workflow_dispatch:
    inputs:
      email:
        description: Staging account email
        required: true
        type: string
      password:
        description: Staging account password
        required: true
        type: string

jobs:
  upsert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Upsert staging platform admin
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          BOOTSTRAP_EMAIL: ${{ inputs.email }}
          BOOTSTRAP_PASSWORD: ${{ inputs.password }}
        run: npx tsx scripts/upsert-staging-platform-admin.ts
