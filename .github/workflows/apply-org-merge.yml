# Apply the organisation merge to PRODUCTION.
#
# TRIGGERED BY A COMMIT MARKER, not workflow_dispatch. A dispatchable workflow has to exist on the
# DEFAULT branch, and this is a one-off operation on specific rows -- it has no business on main,
# where production would carry it forever. Same convention as probe-302-305-production.yml.
#
#   git commit --allow-empty -m 'ops: run it [apply-org-merge]'          # 00, 01, then verify
#   git commit --allow-empty -m 'ops: run it [apply-org-merge-dsgdsg]'   # 03 only, afterwards
#
# THE TWO MARKERS ARE SEPARATE ON PURPOSE. The dsgdsg deactivation was ruled to happen separately
# from the merge and after it lands; a single marker that did both would quietly couple them, and a
# failure in one would sit in the same run as the other.
#
# THIS WORKFLOW WRITES TO THE PRODUCTION DATABASE. Every file it applies is its own transaction with
# its own in-transaction assertions, so a wrong result rolls back rather than committing and being
# reported afterwards. Before-values and paste-ready rollback statements are committed alongside, at
# ops/org-merge/snapshot-2026-08-19-before.txt.
name: Apply organisation merge (production)

on:
  push:
    branches:
      - cloudflare-staging

jobs:
  merge:
    if: contains(github.event.head_commit.message, '[apply-org-merge]')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    name: Merge ChowNow into Riviera's organisation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-staging
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Require SUPABASE_ACCESS_TOKEN
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "ERROR: Add GitHub Actions secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Apply 00 (rename), 01 (merge), 02 (verify)
        run: npx tsx scripts/apply-org-merge-production.ts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      - name: Measure the result independently
        run: npx tsx scripts/probe-org-merge-verify-production-readonly.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  dsgdsg:
    if: contains(github.event.head_commit.message, '[apply-org-merge-dsgdsg]')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    name: Deactivate the dsgdsg test item
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-staging
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Apply 03 (deactivate dsgdsg)
        run: npx tsx scripts/apply-org-merge-production.ts dsgdsg
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
