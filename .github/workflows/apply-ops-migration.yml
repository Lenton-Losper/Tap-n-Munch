name: Apply platform ops migration

# Applies 20260724180000 to staging and/or production via Supabase Management API.
# Requires repo secret: SUPABASE_ACCESS_TOKEN (https://supabase.com/dashboard/account/tokens)
on:
  workflow_dispatch:
    inputs:
      target:
        description: Where to apply
        required: true
        type: choice
        options:
          - staging
          - production
          - both
        default: both

jobs:
  apply:
    runs-on: ubuntu-latest
    name: Apply 20260724180000
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Require SUPABASE_ACCESS_TOKEN
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "ERROR: Add GitHub Actions secret SUPABASE_ACCESS_TOKEN"
            echo "Create at https://supabase.com/dashboard/account/tokens"
            exit 1
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Apply on staging
        if: inputs.target == 'staging' || inputs.target == 'both'
        run: npx tsx scripts/apply-platform-ops-console-staging.ts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      - name: Apply on production
        if: inputs.target == 'production' || inputs.target == 'both'
        run: npx tsx scripts/apply-platform-ops-console-production.ts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      - name: Verify production drift for 20260724180000
        if: inputs.target == 'production' || inputs.target == 'both'
        run: |
          node <<'NODE'
          const { createClient } = require('@supabase/supabase-js')
          const supabase = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY, {
            auth: { autoRefreshToken: false, persistSession: false },
          })
          ;(async () => {
            const { data, error } = await supabase.rpc('list_applied_migration_versions')
            if (error) throw error
            const versions = (data || []).map((r) => String(r.version))
            if (!versions.includes('20260724180000')) {
              console.error('VERIFY FAILED: 20260724180000 not in schema_migrations')
              process.exit(1)
            }
            console.log('VERIFY OK: 20260724180000 applied on production')
            console.log('SAFE TO RUN: Deploy flashtap-production Worker')
          })().catch((e) => { console.error(e); process.exit(1) })
          NODE
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
