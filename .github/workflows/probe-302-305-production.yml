# Re-verify Deploy 1's redaction against PRODUCTION, read-only.
#
# WHY A WORKFLOW. The probe needs the production Supabase service-role key to find an existing
# order to read, and that credential exists only as a GitHub secret — there is no copy on any
# developer machine. Running it here is the only way to point it at production at all.
#
# STRICTLY READ-ONLY. scripts/probe-302-305-production-readonly.ts performs one `.select()` per
# shape and one HTTP GET each. It seeds no fixture and issues no insert, update, delete or rpc —
# production is not a test environment. It refuses to run unless SUPABASE_URL is the production
# project, so a mis-set secret aborts instead of testing the wrong database.
#
# IT DISTINGUISHES FIXED FROM BROKEN. Every shape reports a [control] line first: did the order row
# come back AT ALL. "Both ids are absent" is also what a 404, a wrong table number and a typo'd
# query string look like, so a run where no row arrives is INCONCLUSIVE, not a pass.
name: Probe #302/#305 redaction on production (read-only)

# TRIGGERED BY A COMMIT MARKER, not workflow_dispatch. A dispatchable workflow must exist on the
# DEFAULT branch, and this instrument has no business on main -- it would be repo state that
# production carries for a check production never runs. The marker convention is this repo's own,
# from probe-webhook-sig-fallback.yml.
#
#   git commit --allow-empty -m 'probe: [probe-302-305-production]'
on:
  push:
    branches:
      - cloudflare-staging

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[probe-302-305-production]')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    name: Read-only #302/#305 production redaction probe
    steps:
      - uses: actions/checkout@v4
        with:
          # The probe lives on the working branch, not on main — it is an instrument, not
          # shipped code.
          ref: cloudflare-staging
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Probe #302/#305 redaction (no writes)
        run: npx tsx scripts/probe-302-305-production-readonly.ts
        env:
          # The UNPREFIXED pair is production — the same one production-worker.yml hands to its
          # migration drift check. STAGING_* are a different project entirely.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROD_BASE: https://flashtap.app

      # A second read-only probe on the same run: how long anything has been waiting for the
      # restaurant. Both are pure selects and neither seeds a fixture, so they share a job rather
      # than paying for a second checkout and npm ci.
      - name: Probe unaccepted request age (no writes)
        run: npx tsx scripts/probe-waiting-review-age-production-readonly.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # A third read-only probe: which session-boundary fix the schema actually permits.
      - name: Probe the session boundary (no writes)
        run: npx tsx scripts/probe-session-boundary-production-readonly.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # The VAT split on a PAID receipt — data problem or calculation defect. Read-only.
      - name: Probe the VAT split on order #10 (no writes)
        run: npx tsx scripts/probe-vat-split-order-10-production-readonly.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # How many menu items have no tax rate set. Counts only — existing rows are not touched.
      - name: Probe menu items with no tax rate (no writes)
        run: npx tsx scripts/probe-null-tax-rate-items-production-readonly.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Context for the incoming-order SOUND ALERT: which realtime insert(s) a customer order
      # actually produces, and an upper bound on concurrent dashboards. Read-only.
      - name: Probe dashboard sound context (no writes)
        run: npx tsx scripts/probe-dashboard-sound-context-production-readonly.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # How many production orders say 'cash', and how many of those are TAB orders where the
      # route stamped it and nobody was asked. Decides migration vs schema tidy. Read-only.
      - name: Probe payment_method cash on tab orders (no writes)
        run: npx tsx scripts/probe-payment-method-cash-production-readonly.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Abandoned-request count before the status change touches anything, plus tab-creation
      # context and the tab-PIN census for the End Session hole. Read-only.
      - name: Probe abandoned requests and tab creation (no writes)
        run: npx tsx scripts/probe-abandoned-and-tab-creation-production-readonly.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # The order behind the 08:47 Mingle decline (FT17871220357211600) — what state did a
      # mid-flow decline leave it in, on a device without #182/#183. Read-only.
      - name: Probe the Mingle decline order state (no writes)
        run: npx tsx scripts/probe-mingle-decline-20260819-production-readonly.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # FNB ChowNow staff roster + rename history. Read-only.
      - name: Probe ChowNow staff (no writes)
        run: npx tsx scripts/probe-chownow-staff-production-readonly.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Is the organisations layer live? Tables, rows, and whether anything is wired to one.
      - name: Probe organisations layer (no writes)
        run: npx tsx scripts/probe-organisations-live-production-readonly.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Rows exist because signup creates them. Has anyone actually USED the feature?
      - name: Probe organisations feature usage (no writes)
        run: npx tsx scripts/probe-org-feature-usage-production-readonly.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Could Riviera and the ChowNows share one organisation? Measure what a move lands on.
      - name: Probe org merge feasibility (no writes)
        run: npx tsx scripts/probe-org-merge-feasibility-production-readonly.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Standing rule: re-verify Deploy 1's redaction after every production deploy.
      - name: Verify Deploy 1 redaction live (positive control, no writes)
        run: npx tsx scripts/verify-deploy1-redaction-live-production.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Pre-merge snapshot and catalogue collision check. Read-only; runs before any write.
      - name: Probe org merge snapshot (no writes)
        run: npx tsx scripts/probe-org-merge-snapshot-production-readonly.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # What is the dsgdsg test debris linked to? Asked before any deletion.
      - name: Probe dsgdsg links (no writes)
        run: npx tsx scripts/probe-dsgdsg-links-production-readonly.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Is there any transactional SQL route to production from CI at all?
      - name: Probe SQL execution route (no writes)
        run: npx tsx scripts/probe-can-we-run-sql-on-production-readonly.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Why does the Locations list show only Riviera after the merge?
      - name: Probe locations list visibility (no writes)
        run: npx tsx scripts/probe-locations-list-visibility-production-readonly.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Independent post-merge measurement: a different connection and code path to the SQL.
      - name: Verify org merge independently (one self-assignment write)
        run: npx tsx scripts/probe-org-merge-verify-production-readonly.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # What did Add Location create, and what does the new site still lack?
      - name: Probe new location readiness (no writes)
        run: npx tsx scripts/probe-new-location-readiness-production-readonly.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
