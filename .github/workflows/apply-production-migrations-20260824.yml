name: Apply the 2026-08-24 production migrations

# ONE-OFF. Applies exactly the five `-- @env: both` migrations from the 2026-08-24 batch to
# PRODUCTION, then repairs the migration ledger for each.
#
# WHY THIS EXISTS RATHER THAN safe-supabase-linked FROM A WORKSTATION:
#   `safe-supabase-linked ... --linked` operates on whatever project the Supabase CLI is linked to.
#   In the qrd-stage worktree that is STAGING, and re-linking to production needs a
#   SUPABASE_ACCESS_TOKEN or DB password that is not present there. CI already holds both as repo
#   secrets, and this follows the same three-way fallback the staging workflow uses.
#
# WHAT IT WILL NOT DO:
#   - it applies a HARD-CODED LIST of five versions, never "everything pending". The batch branch
#     deliberately excludes two headerless migrations (20260705210000, 20260705220000) which default
#     to `both` and are not applied on production; an "apply all pending" step would sweep them in,
#     which is the exact mistake the exclusion exists to prevent.
#   - it refuses unless `confirm` is typed exactly, so a stray click cannot run DDL on production.
#   - it verifies the resolved project ref is production BEFORE each apply.
#
# ORDER MATTERS: run this BEFORE the worker deploy. All five are additive and backward-compatible
# (two columns with defaults, one grant, three functions nothing calls yet), so production tolerates
# them ahead of the code. The reverse does not hold: the code reads card_payments_available and
# is_counter_service, and production-worker.yml's drift check fails while they are unapplied.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY-TO-PRODUCTION to proceed'
        required: true
        type: string

jobs:
  apply:
    runs-on: ubuntu-latest
    name: Apply five migrations to production
    steps:
      - name: Refuse unless explicitly confirmed
        run: |
          if [ "${{ inputs.confirm }}" != "APPLY-TO-PRODUCTION" ]; then
            echo "REFUSING: confirm was '${{ inputs.confirm }}', expected APPLY-TO-PRODUCTION"
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: Confirm the target is PRODUCTION
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          set -euo pipefail
          echo "SUPABASE_URL host: $(echo "$SUPABASE_URL" | sed 's|https://||; s|\.supabase\.co.*||')"
          case "$SUPABASE_URL" in
            *ihlmmpmolnpchzgwyhgh*) echo "confirmed: production" ;;
            *mdqjpxwczrhkxkbqatqa*) echo "REFUSING: SUPABASE_URL is STAGING"; exit 1 ;;
            *) echo "REFUSING: SUPABASE_URL is neither known project"; exit 1 ;;
          esac

      - name: Apply, then repair the ledger, one migration at a time
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          PROD_REF=ihlmmpmolnpchzgwyhgh

          # EXACTLY these five. Not a glob, not "pending" -- see the header.
          VERSIONS="20260824120000 20260824123000 20260824130000 20260824140000 20260824150000"

          DB_URL="${DATABASE_URL:-${SUPABASE_DB_URL:-}}"
          MODE=""
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            npx supabase link --project-ref "$PROD_REF" --yes
            MODE=linked
          elif [ -n "$DB_URL" ]; then
            MODE=dburl
          elif [ -n "${SUPABASE_DB_PASSWORD:-}" ]; then
            npx supabase link --project-ref "$PROD_REF" -p "$SUPABASE_DB_PASSWORD" --yes
            MODE=linked
          else
            echo "ERROR: no way to apply DDL. Need SUPABASE_ACCESS_TOKEN, DATABASE_URL or SUPABASE_DB_PASSWORD."
            exit 1
          fi
          echo "mode: $MODE"

          for VER in $VERSIONS; do
            MIG=$(ls supabase/migrations/${VER}_*.sql)
            echo "=============================================================="
            echo "APPLYING $MIG"
            head -1 "$MIG"
            echo "=============================================================="

            if [ "$MODE" = "dburl" ]; then
              npx supabase db query --db-url "$DB_URL" -f "$MIG"
              npx supabase db query --db-url "$DB_URL" \
                "INSERT INTO supabase_migrations.schema_migrations(version) VALUES ('$VER') ON CONFLICT DO NOTHING"
            else
              # safe-supabase-linked verifies the ref again itself, per operation, as instructed.
              npx tsx scripts/safe-supabase-linked.ts "$PROD_REF" db query --linked -f "$MIG"
              npx tsx scripts/safe-supabase-linked.ts "$PROD_REF" migration repair --linked --status applied "$VER"
            fi
            echo "APPLIED $VER"
          done

      - name: Prove the effect, not the exit code
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { createClient } = require('@supabase/supabase-js')
          const db = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY, {
            auth: { persistSession: false },
          })
          ;(async () => {
            let bad = 0
            const say = (ok, label, detail) => {
              if (!ok) bad++
              console.log(`  ${ok ? 'PASS' : '*** FAIL ***'}  ${label}${detail ? '  ' + detail : ''}`)
            }

            // The two columns the deployed code reads. A missing one 500s every menu load.
            for (const col of ['is_counter_service', 'card_payments_available']) {
              const { error } = await db.from('restaurants').select(`id,${col}`).limit(1)
              say(!error, `restaurants.${col} exists`, error ? error.message : '')
            }

            // The three functions. Calling with a nonsense id must RAISE (not found), which proves
            // the function exists -- a missing function returns a different error entirely.
            const NIL = '00000000-0000-0000-0000-000000000000'
            for (const [fn, args] of [
              ['reap_abandoned_tab', { p_tab_id: NIL, p_inactive_hours: 4 }],
              ['reject_transfer', { p_transfer_id: NIL, p_user_id: NIL, p_reason: 'probe' }],
              ['return_transfer_stock_to_source', { p_transfer_id: NIL, p_user_id: NIL, p_reason: 'probe' }],
            ]) {
              const { error } = await db.rpc(fn, args)
              const missing = error && /could not find|does not exist|PGRST202/i.test(error.message)
              say(!missing, `function ${fn} is deployed`, error ? error.message.slice(0, 70) : 'no error')
            }

            console.log(bad === 0 ? '\nMIGRATIONS_VERIFIED_OK' : `\n*** ${bad} CHECK(S) FAILED ***`)
            process.exit(bad === 0 ? 0 : 1)
          })()
          NODE
