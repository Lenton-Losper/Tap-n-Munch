  build-verification:
    runs-on: ubuntu-latest
    name: Build Verification (Lint, Typecheck, Unit Tests)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The drift check compares branches by patch-id and reverse-applies patches against
          # the tree. Both need real history; the default depth-1 checkout has neither.
          fetch-depth: 0
      # Runs before `npm ci` so node_modules cannot pollute the scan.
      # #142: conflict markers sat in a JSDoc block for days because neither the build nor
      # typecheck could see them. Catches a class of error typecheck structurally cannot.
      - name: Reject committed conflict markers
        run: |
          set -euo pipefail
          if grep -rnE '^(<<<<<<<|>>>>>>>)' app lib components workers; then
            echo "ERROR: merge conflict markers are committed (listed above)."
            exit 1
          fi
          echo "No conflict markers found."
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npx eslint . --max-warnings=0
      - name: Typecheck
        run: npx tsc --noEmit
      # "Order #0" has reached production THREE times, in three different files, each time
      # because a render site asked "does this order have a number?" itself instead of asking
      # hasAllocatedOrderNumber(). `!= null` and `typeof === 'number'` both admit 0, and an
      # order_request carries order_number as an empty string, which Number() turns into 0.
      # Static: no credentials, no database. BLOCKING — the tree is clean as of 2026-08-19, so
      # this can only fail on something NEW.
      # A @ts-nocheck file has opted out of the one tool that catches a named import which does
      # not exist. ActiveOrderBanner imported and CALLED orderPlacedAtMs for ten hours -- tsc
      # skipped the file, jest turned the missing import into `undefined` without throwing, and
      # only the bundler noticed, by which point it was a failed deploy on every push.
      - name: Named imports in @ts-nocheck files resolve
        run: node scripts/check-nocheck-imports-resolve.mjs
      # The other half of the same hole, and the half that has now taken production down. On
      # 2026-08-26 a real call in orders-dashboard.tsx was replaced with `noFallbackAtAll(` and
      # tsc, the import checker above, and all 211 jest suites stayed GREEN -- the pragma hides the
      # file, the name is not an import, and an unbound name is `undefined` rather than a throw.
      # This strips the pragma in memory and asks the real compiler which names resolve to nothing.
      # No allowlist: the compiler's own scope resolution handles dynamic dispatch, object methods,
      # shadowed locals and JSX names for free. It self-tests two-sided before reporting, driving
      # the same function it checks with.
      - name: Names referenced in @ts-nocheck files resolve
        run: node scripts/check-nocheck-names-resolve.mjs
      - name: Every order-number test goes through hasAllocatedOrderNumber
        run: npx tsx scripts/check-order-number-guard.ts

      # #127, the WRITE side of the same column. count(*)+1 was the allocator in five places and
      # two of them had no caller at all, which is how a sixth copy gets written. Static: no
      # credentials, no database. BLOCKING - the tree is clean as of 2026-08-26.
      - name: Every order number is issued by lib/orders/order-number.ts
        run: npx tsx scripts/check-order-number-allocation.ts

      # Static: no credentials, no database. BLOCKING - the tree is clean as of 2026-08-20, so
      # this can only fail on something NEW. Self-tests its own detectors before reporting.
      - name: Every session-restaurant lookup goes through resolveSessionRestaurantId
        run: npx tsx scripts/check-session-restaurant-resolver.ts

      # Static: no credentials, no database. BLOCKING - the tree is clean as of 2026-08-20.
      # Self-tests its own detectors, including the stored-builder and generic-argument cases that
      # produced false positives in earlier drafts.
      - name: Every read of orders is ranged, narrowed, or paginated
        run: npx tsx scripts/check-orders-read-bounded.ts
      # #324, WIRED 2026-08-27 -- see the fuller note in production-worker.yml. Written as a
      # blocking gate and added to no workflow, while its own docblock and a deployed COMMENT ON
      # both stated that CI enforced it. Static, no credentials, no database. It belongs on staging
      # as well as production so an offending query is caught where it is written rather than at
      # the promotion, which is the whole reason the sibling read-bounded gate runs in both.
      - name: Cross-venue measurements over orders exclude the stress fixtures
        run: npx tsx scripts/check-orders-fixture-excluded.ts
      # WIRED 2026-08-27 -- see the fuller note in production-worker.yml. Guards the terminal's
      # ability to recover from an ordinary hourly token expiry. It ran in no workflow and had
      # three ways of not failing, all now fixed and mutation-verified. Static, no credentials.
      - name: Terminal auth handlers return a thrown auth Response unchanged
        run: npx tsx scripts/check-terminal-auth-catch.ts
      # #172: `@ts-nocheck` hides a file from `tsc --noEmit` entirely, and the gate exists
      # because a TS2339 reached production -- exactly the class the pragma suppresses. This does
      # NOT fix the nine existing files; it makes the set a ratchet so no NEW one appears.
      - name: No new @ts-nocheck files
        run: node scripts/check-ts-nocheck-baseline.mjs
      # WIRED 2026-08-27 -- see the fuller note in production-worker.yml. Built after the
      # 2026-08-26 staff-dashboard outage (an identifier used and never imported, invisible to tsc
      # because the file is @ts-nocheck, and to eslint because no-undef is off for TS), then added
      # to no workflow. It belongs on staging too: a ReferenceError on a staff surface is exactly
      # what staging exists to catch before the promotion.
      - name: Every identifier in a @ts-nocheck file is bound
        run: node scripts/check-nocheck-undefined-identifiers.mjs
      # #212: an inline CHECK on `ADD COLUMN IF NOT EXISTS` is silently skipped
      # when the column already exists — the migration succeeds and the
      # constraint is never created. Static, no credentials, no database.
      # BLOCKING here, unlike the drift check below: the five existing offenders
      # are baselined inside the script, so this can only fail on something new.
      - name: Reject inline CHECK on ADD COLUMN IF NOT EXISTS
        run: npx tsx scripts/check-migration-inline-check.ts
      # #280, ADDED TO STAGING 2026-08-27. It ran on production only, which is the wrong branch for
      # it. The collision it detects is authored HERE: two agents on two unpushed branches drawing
      # `<today>HHMMSS` from the same clock and both rounding to the hour, which is the expected
      # outcome of the naming convention under concurrency rather than bad luck. Catching it at the
      # production promotion means catching it after both migrations already exist and one of them
      # may have run somewhere -- and a migration that has run against a database must never be
      # renumbered, so the cheap fix (bump the HHMMSS) is exactly the one that has expired by then.
      # Static, no credentials, no database; self-tests its detector before reporting.
      - name: Every migration version maps to one filename
        run: node scripts/check-migration-version-unique.mjs
      # cloudflare-staging fell 23 commits behind main without anyone noticing, and the only
      # number on offer overstated it 2.4x (250 by rev-list, 106 by patch-id), so looking did not
      # help. Among the gap was a live PostgREST .or() injection fix main had and staging did not.
      #
      # BLOCKING, unlike the migration drift check below, and for the same reason the inline-CHECK
      # step above is blocking: the existing gap is baselined inside the script, so this can only
      # fail on drift that is NEW. Main being ahead of staging is a defect, not a state — it is the
      # direction that silently reverts a production security fix on the next merge.
      #
      # This runs BEFORE the deploy job (which `needs: build-verification`), so failing here
      # blocks the staging deploy outright.
      - name: Check branch drift (main vs cloudflare-staging, by patch-id)
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          git fetch --no-tags origin cloudflare-staging:refs/remotes/origin/cloudflare-staging || true
          node scripts/check-branch-drift.mjs origin/main origin/cloudflare-staging
      # `realtime` removed from this pattern 2026-08-24 (#332). __tests__/realtime.test.ts opened a
      # WebSocket to Supabase and checked it acked two channel joins. It imported `ws` and nothing
      # else -- no app module, no route, no library -- so deleting the entire FlashTap application
      # would not have made it fail. It tested a DEPENDENCY, and its only failure modes were
      # timeouts and network errors, which is the definition of a flaky CI suite.
      - name: Unit and schema tests (no HTTP)
        run: npx jest --ci --forceExit --testPathPattern="schema-constraints|supabase-schema|payment|apk-terminal|capabilities"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Check migration drift (staging DB vs supabase/migrations)
        # Non-blocking for now: staging has known pre-existing drift (see #20/#38
        # investigation) that needs its own reviewed cleanup pass before this can
        # safely gate deploys. Surfaces the mismatch visibly without blocking.
        continue-on-error: true
        run: node scripts/check-migration-drift.mjs
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      - name: Recipe deduction idempotency tests (staging Supabase)
        run: npx jest --ci --forceExit --testPathPattern="recipe-deduction"
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      - name: Staging authorize tests (staging Supabase)
        run: npx jest --ci --forceExit --maxWorkers=1 --testPathPattern="authorize-|staff-role"
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-verification
    name: Deploy to Cloudflare Workers
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build with OpenNext
        run: npx @opennextjs/cloudflare@1.20.1 build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: https://flashtap-staging.llosperofficial.workers.dev
          NEXT_PUBLIC_BASE_URL: https://flashtap-staging.llosperofficial.workers.dev
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
          GIT_COMMIT_SHA: ${{ github.sha }}
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      - name: Set Cloudflare worker secrets
        run: |
          if [ -n "$CRON_SECRET" ]; then
            echo "$CRON_SECRET" | npx wrangler@3.99.0 secret put CRON_SECRET
          else
            echo "WARNING: STAGING_CRON_SECRET not set — expire-pending will reject all callers until configured"
          fi
          # #266: this was set out of band, so the Worker was not reproducible from the repo.
          # Unlike CRON_SECRET above, a missing value here does NOT surface as a broken feature:
          # createServerSupabaseClient() falls back to the anon key (lib/supabase/server.ts), so
          # every server route would silently run as `anon` under RLS instead of service_role.
          # A warning nobody reads is how this drifted in the first place — fail the job. This
          # step runs BEFORE `wrangler deploy`, so failing here blocks the deploy outright.
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "ERROR: STAGING_SUPABASE_SERVICE_ROLE_KEY is empty — server routes would silently fall back to the anon key."
            exit 1
          fi
          echo "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler@3.99.0 secret put SUPABASE_SERVICE_ROLE_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CRON_SECRET: ${{ secrets.STAGING_CRON_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      - name: Deploy to Cloudflare Workers
        run: npx wrangler@3.99.0 deploy --var GIT_COMMIT_SHA:${{ github.sha }} --var NEXT_PUBLIC_COMMIT_SHA:${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deployment-verification:
    runs-on: ubuntu-latest
    needs: deploy
    name: Deployment Verification (Smoke + Integration + E2E)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Smoke tests
        run: |
          sleep 10
          curl -f https://flashtap-staging.llosperofficial.workers.dev/ || exit 1
          curl -f https://flashtap-staging.llosperofficial.workers.dev/api/menu/ade55dd9-ab0d-46c7-9f53-d65f4bed4305/features || exit 1
          echo "Smoke tests passed"
      - name: Integration tests (HTTP)
        run: npx jest --ci --forceExit __tests__/permissions.test.ts __tests__/web-routing.test.ts
        env:
          FLASHTAP_BASE_URL: https://flashtap-staging.llosperofficial.workers.dev
          RIVIERA_URL: https://riviera.flashtap.app
      - name: Staging authorize tests (staging Supabase)
        run: npx jest --ci --forceExit --maxWorkers=1 --testPathPattern="authorize-|staff-role"
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      - name: Ensure E2E kiosk fixture
        run: node scripts/ensure-e2e-kiosk-fixture.mjs
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          E2E_BASE_URL: https://flashtap-staging.llosperofficial.workers.dev
      - name: Playwright E2E tests
        run: npm run test:e2e
        env:
          E2E_BASE_URL: https://flashtap-staging.llosperofficial.workers.dev
          # ADDED 2026-08-18. Every spec that seeds its own fixture calls `assertStagingDb()` in
          # tests/e2e/lib/fixture.ts, which throws `missing env SUPABASE_URL` before the browser
          # opens. That helper landed on 2026-08-16 with the browser suite and this step's env was
          # never extended, so EIGHT specs have failed on every push since — banner-shows-only-my-order,
          # browse-header-fits, click-test-script, editor-desired-quantities,
          # line-configuration-is-visible, no-invented-order-number, order-identity-and-status and
          # repro-known-defects. All eight died in `beforeAll` with the same message.
          #
          # The deploy job runs BEFORE this one, so the red never blocked anything: the worker
          # shipped and the gate failed afterwards. Two days of that.
          #
          # Same secret names the neighbouring staging steps use. STAGING_*, never the unprefixed
          # pair — those are PRODUCTION, and the fixture writes.
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          # The dashboard spec mints a staff user and signs in through the form; without this it
          # REFUSES rather than reporting 'the banner is absent', which is why staging went red
          # the moment it landed.
          STAGING_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
