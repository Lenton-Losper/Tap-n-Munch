name: Deploy to Cloudflare Staging

on:
  push:
    branches:
      - cloudflare-staging

jobs:
  build-verification:
    runs-on: ubuntu-latest
    name: Build Verification (Lint, Typecheck, Unit Tests)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npx eslint . --max-warnings=0 || true
      - name: Typecheck
        run: npx tsc --noEmit || true
      - name: Unit and schema tests (no HTTP)
        run: npx jest --ci --forceExit --testPathPattern="schema-constraints|supabase-schema|payment|realtime|apk-terminal"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-verification
    name: Deploy to Cloudflare Workers
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build with OpenNext
        run: npx @opennextjs/cloudflare@1.20.1 build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: https://flashtap-staging.llosperofficial.workers.dev
          NEXT_PUBLIC_BASE_URL: https://flashtap-staging.llosperofficial.workers.dev
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      - name: Deploy to Cloudflare Workers
        run: npx wrangler@3.99.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deployment-verification:
    runs-on: ubuntu-latest
    needs: deploy
    name: Deployment Verification (Smoke + Integration + E2E)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Smoke tests
        run: |
          sleep 10
          curl -f https://flashtap-staging.llosperofficial.workers.dev/ || exit 1
          curl -f https://flashtap-staging.llosperofficial.workers.dev/api/menu/ade55dd9-ab0d-46c7-9f53-d65f4bed4305/features || exit 1
          echo "Smoke tests passed"
      - name: Integration tests (HTTP)
        run: npx jest --ci --forceExit --testPathPattern="permissions|web-routing"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FLASHTAP_BASE_URL: https://flashtap-staging.llosperofficial.workers.dev
          RIVIERA_URL: https://riviera.flashtap.app
      - name: Playwright E2E tests
        run: npm run test:e2e
        env:
          E2E_BASE_URL: https://flashtap-staging.llosperofficial.workers.dev
