name: Deploy to Cloudflare Staging

on:
  push:
    branches:
      - cloudflare-staging

jobs:

  verify-document-engine:
    # Runs after DDL is applied (SQL editor or credentials). Does not apply DDL.
    if: contains(github.event.head_commit.message, '[verify-document-engine]')
    runs-on: ubuntu-latest
    name: Verify Document Engine (staging service-role)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Functional verify (assumes migration already applied)
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/verify-document-engine-staging.ts

  apply-document-engine:
    # One-shot DDL apply when a credential secret exists. Repo currently has none of
    # SUPABASE_ACCESS_TOKEN / STAGING_DATABASE_URL / STAGING_SUPABASE_DB_PASSWORD —
    # paste scripts/sql/apply-20260725200000-document-engine.sql in the staging SQL
    # editor, then push with [verify-document-engine].
    if: contains(github.event.head_commit.message, '[apply-document-engine]')
    runs-on: ubuntu-latest
    name: Apply Document Engine migration (staging)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Probe apply credentials (no values printed)
        run: |
          has_token=0; has_db_url=0; has_db_password=0
          [ -n "$SUPABASE_ACCESS_TOKEN" ] && has_token=1
          [ -n "$STAGING_DATABASE_URL$DATABASE_URL$SUPABASE_DB_URL" ] && has_db_url=1
          [ -n "$STAGING_SUPABASE_DB_PASSWORD$SUPABASE_DB_PASSWORD" ] && has_db_password=1
          echo "Credential probe: token=$has_token db_url=$has_db_url db_password=$has_db_password"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          STAGING_SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Apply Document Engine migration on staging
        run: |
          set -euo pipefail
          MIG=supabase/migrations/20260725200000_document_engine_credit_notes_lineage.sql
          VER=20260725200000
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Using SUPABASE_ACCESS_TOKEN + linked Management API"
            npx tsx scripts/apply-document-engine-staging.ts
            exit 0
          fi
          DB_URL="${STAGING_DATABASE_URL:-${DATABASE_URL:-${SUPABASE_DB_URL:-}}}"
          if [ -n "$DB_URL" ]; then
            echo "Using database URL with supabase db query --db-url"
            npx supabase db query --db-url "$DB_URL" -f "$MIG"
            npx supabase db query --db-url "$DB_URL" "INSERT INTO supabase_migrations.schema_migrations(version) VALUES ('$VER') ON CONFLICT DO NOTHING"
            echo "APPLY_DOCUMENT_ENGINE_STAGING_OK (db-url)"
            exit 0
          fi
          DB_PASSWORD="${STAGING_SUPABASE_DB_PASSWORD:-${SUPABASE_DB_PASSWORD:-}}"
          if [ -n "$DB_PASSWORD" ]; then
            echo "Using DB password + supabase link"
            npx supabase link --project-ref mdqjpxwczrhkxkbqatqa -p "$DB_PASSWORD" --yes
            npx tsx scripts/safe-supabase-linked.ts mdqjpxwczrhkxkbqatqa db query --linked -f "$MIG"
            npx tsx scripts/safe-supabase-linked.ts mdqjpxwczrhkxkbqatqa migration repair --linked --status applied "$VER"
            echo "APPLY_DOCUMENT_ENGINE_STAGING_OK (password)"
            exit 0
          fi
          echo "ERROR: No way to apply DDL. Add one of:"
          echo "  - SUPABASE_ACCESS_TOKEN (preferred)"
          echo "  - STAGING_DATABASE_URL / DATABASE_URL"
          echo "  - STAGING_SUPABASE_DB_PASSWORD"
          echo "Or paste $MIG into the Supabase SQL editor for staging."
          exit 1
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          STAGING_SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Verify schema + correct_invoice flows
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          STAGING_SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          # verify script needs linked CLI for information_schema queries
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            npx tsx scripts/verify-document-engine-staging.ts
            exit 0
          fi
          DB_PASSWORD="${STAGING_SUPABASE_DB_PASSWORD:-${SUPABASE_DB_PASSWORD:-}}"
          if [ -n "$DB_PASSWORD" ]; then
            npx supabase link --project-ref mdqjpxwczrhkxkbqatqa -p "$DB_PASSWORD" --yes
            npx tsx scripts/verify-document-engine-staging.ts
            exit 0
          fi
          # Service-role-only subset when CLI link unavailable
          npx tsx scripts/verify-document-engine-staging.ts

  build-verification:
    runs-on: ubuntu-latest
    name: Build Verification (Lint, Typecheck, Unit Tests)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npx eslint . --max-warnings=0
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit and schema tests (no HTTP)
        run: npx jest --ci --forceExit --testPathPattern="schema-constraints|supabase-schema|payment|realtime|apk-terminal|capabilities"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Check migration drift (staging DB vs supabase/migrations)
        # Non-blocking for now: staging has known pre-existing drift (see #20/#38
        # investigation) that needs its own reviewed cleanup pass before this can
        # safely gate deploys. Surfaces the mismatch visibly without blocking.
        continue-on-error: true
        run: node scripts/check-migration-drift.mjs
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      - name: Recipe deduction idempotency tests (staging Supabase)
        run: npx jest --ci --forceExit --testPathPattern="recipe-deduction"
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      - name: Staging authorize tests (staging Supabase)
        run: npx jest --ci --forceExit --maxWorkers=1 --testPathPattern="authorize-|staff-role"
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-verification
    name: Deploy to Cloudflare Workers
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build with OpenNext
        run: npx @opennextjs/cloudflare@1.20.1 build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: https://flashtap-staging.llosperofficial.workers.dev
          NEXT_PUBLIC_BASE_URL: https://flashtap-staging.llosperofficial.workers.dev
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
          GIT_COMMIT_SHA: ${{ github.sha }}
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      - name: Set Cloudflare worker secrets
        run: |
          if [ -n "$CRON_SECRET" ]; then
            echo "$CRON_SECRET" | npx wrangler@3.99.0 secret put CRON_SECRET
          else
            echo "WARNING: STAGING_CRON_SECRET not set — expire-pending will reject all callers until configured"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CRON_SECRET: ${{ secrets.STAGING_CRON_SECRET }}
      - name: Deploy to Cloudflare Workers
        run: npx wrangler@3.99.0 deploy --var GIT_COMMIT_SHA:${{ github.sha }} --var NEXT_PUBLIC_COMMIT_SHA:${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deployment-verification:
    runs-on: ubuntu-latest
    needs: deploy
    name: Deployment Verification (Smoke + Integration + E2E)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Smoke tests
        run: |
          sleep 10
          curl -f https://flashtap-staging.llosperofficial.workers.dev/ || exit 1
          curl -f https://flashtap-staging.llosperofficial.workers.dev/api/menu/ade55dd9-ab0d-46c7-9f53-d65f4bed4305/features || exit 1
          echo "Smoke tests passed"
      - name: Integration tests (HTTP)
        run: npx jest --ci --forceExit __tests__/permissions.test.ts __tests__/web-routing.test.ts
        env:
          FLASHTAP_BASE_URL: https://flashtap-staging.llosperofficial.workers.dev
          RIVIERA_URL: https://riviera.flashtap.app
      - name: Staging authorize tests (staging Supabase)
        run: npx jest --ci --forceExit --maxWorkers=1 --testPathPattern="authorize-|staff-role"
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      - name: Ensure E2E kiosk fixture
        run: node scripts/ensure-e2e-kiosk-fixture.mjs
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          E2E_BASE_URL: https://flashtap-staging.llosperofficial.workers.dev
      - name: Playwright E2E tests
        run: npm run test:e2e
        env:
          E2E_BASE_URL: https://flashtap-staging.llosperofficial.workers.dev
