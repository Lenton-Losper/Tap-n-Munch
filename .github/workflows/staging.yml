name: Deploy to Cloudflare Staging

on:
  push:
    branches:
      - cloudflare-staging

jobs:

  probe-realtime-and-23505:
    if: contains(github.event.head_commit.message, '[probe-realtime-and-23505]')
    runs-on: ubuntu-latest
    name: Probe realtime publication + hosted 23505 payload
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Query publication + run 23505 retry against staging Worker
        env:
          STAGING_WORKER_URL: https://flashtap-staging.llosperofficial.workers.dev
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: npx tsx scripts/probe-realtime-and-23505-staging.ts
      - name: Empirical realtime subscription probe (orders + order_requests)
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/probe-realtime-empirical-staging.ts

  probe-order-request-accept-race:
    if: contains(github.event.head_commit.message, '[probe-order-request-accept-race]')
    runs-on: ubuntu-latest
    needs: deploy
    name: Probe concurrent order-request Accept race
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Concurrent Accept → one order, one 409
        env:
          STAGING_WORKER_URL: https://flashtap-staging.llosperofficial.workers.dev
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: npx tsx scripts/probe-order-request-accept-race-staging.ts

  probe-orders-status-race:
    if: contains(github.event.head_commit.message, '[probe-orders-status-race]')
    runs-on: ubuntu-latest
    needs: deploy
    name: Probe concurrent orders status Accept vs Cancel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Concurrent Accept vs Cancel → one 200, one 409
        env:
          STAGING_WORKER_URL: https://flashtap-staging.llosperofficial.workers.dev
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: npx tsx scripts/probe-orders-status-accept-cancel-race-staging.ts

  apply-tenant-isolation-rls:
    # Apply ENABLE+FORCE RLS for tabs/restaurants/users/customer_sessions.
    # If DDL secrets are empty, paste scripts/sql/apply-20260726200000-tenant-isolation-rls.sql
    # in the staging SQL editor, then push with [probe-tenant-isolation].
    if: contains(github.event.head_commit.message, '[apply-tenant-isolation-rls]')
    runs-on: ubuntu-latest
    continue-on-error: true
    name: Apply tenant isolation RLS (staging)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Probe apply credentials (no values printed)
        run: |
          has_token=0; has_db_url=0; has_db_password=0
          [ -n "$SUPABASE_ACCESS_TOKEN" ] && has_token=1
          [ -n "$STAGING_DATABASE_URL$DATABASE_URL$SUPABASE_DB_URL" ] && has_db_url=1
          [ -n "$STAGING_SUPABASE_DB_PASSWORD$SUPABASE_DB_PASSWORD" ] && has_db_password=1
          echo "Credential probe: token=$has_token db_url=$has_db_url db_password=$has_db_password"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          STAGING_SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Apply tenant isolation RLS migration on staging
        run: |
          set -euo pipefail
          MIG=supabase/migrations/20260726200000_enable_rls_tabs_restaurants_users_sessions.sql
          VER=20260726200000
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Using SUPABASE_ACCESS_TOKEN + linked Management API"
            npx tsx scripts/apply-tenant-isolation-rls-staging.ts
            exit 0
          fi
          DB_URL="${STAGING_DATABASE_URL:-${DATABASE_URL:-${SUPABASE_DB_URL:-}}}"
          if [ -n "$DB_URL" ]; then
            echo "Using database URL with supabase db query --db-url"
            npx supabase db query --db-url "$DB_URL" -f "$MIG"
            npx supabase db query --db-url "$DB_URL" "INSERT INTO supabase_migrations.schema_migrations(version) VALUES ('$VER') ON CONFLICT DO NOTHING"
            echo "APPLY_TENANT_ISOLATION_RLS_STAGING_OK (db-url)"
            exit 0
          fi
          DB_PASSWORD="${STAGING_SUPABASE_DB_PASSWORD:-${SUPABASE_DB_PASSWORD:-}}"
          if [ -n "$DB_PASSWORD" ]; then
            echo "Using DB password + supabase link"
            npx supabase link --project-ref mdqjpxwczrhkxkbqatqa -p "$DB_PASSWORD" --yes
            npx tsx scripts/safe-supabase-linked.ts mdqjpxwczrhkxkbqatqa db query --linked -f "$MIG"
            npx tsx scripts/safe-supabase-linked.ts mdqjpxwczrhkxkbqatqa migration repair --linked --status applied "$VER"
            echo "APPLY_TENANT_ISOLATION_RLS_STAGING_OK (password)"
            exit 0
          fi
          echo "ERROR: No way to apply DDL. Add one of:"
          echo "  - SUPABASE_ACCESS_TOKEN (preferred)"
          echo "  - STAGING_DATABASE_URL / DATABASE_URL"
          echo "  - STAGING_SUPABASE_DB_PASSWORD"
          echo "Or paste scripts/sql/apply-20260726200000-tenant-isolation-rls.sql into the staging SQL editor."
          exit 1
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          STAGING_SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  probe-tenant-isolation:
    if: contains(github.event.head_commit.message, '[probe-tenant-isolation]')
    runs-on: ubuntu-latest
    needs: deploy
    name: Probe multi-tenant isolation (RLS + IDOR + session bind)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Cross-tenant isolation checks against staging
        env:
          STAGING_WORKER_URL: https://flashtap-staging.llosperofficial.workers.dev
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: npx tsx scripts/probe-tenant-isolation-staging.ts

  probe-terminal-callback-integrity:
    if: contains(github.event.head_commit.message, '[probe-terminal-callback-integrity]')
    runs-on: ubuntu-latest
    needs: deploy
    name: Probe terminal callback cancel integrity (#82)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Payment-failed + status-cancelled four-field integrity
        env:
          STAGING_WORKER_URL: https://flashtap-staging.llosperofficial.workers.dev
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/probe-terminal-callback-integrity-staging.ts

  verify-terminal-payment-failed-finatic-guard:
    if: contains(github.event.head_commit.message, '[verify-terminal-payment-failed-finatic-guard]')
    runs-on: ubuntu-latest
    name: Verify terminal payment-failed Finatic guard (#635)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: False-failure → correct to paid (Finatic stub + real staging DB)
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/verify-terminal-payment-failed-finatic-guard-staging.ts

  probe-terminal-finatic-guard-http:
    if: contains(github.event.head_commit.message, '[probe-terminal-finatic-guard-http]')
    runs-on: ubuntu-latest
    needs: deploy
    name: Probe terminal Finatic guard over HTTP (#635)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Payment + status cancel Finatic guard via staging Worker HTTP
        env:
          STAGING_WORKER_URL: https://flashtap-staging.llosperofficial.workers.dev
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/probe-terminal-finatic-guard-http-staging.ts

  probe-attempt-started-http:
    if: contains(github.event.head_commit.message, '[probe-attempt-started-http]')
    runs-on: ubuntu-latest
    needs: deploy
    name: Probe terminal attempt-started over HTTP (staging)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Attempt-started marker + E04111 cron discriminator via staging Worker HTTP
        env:
          STAGING_WORKER_URL: https://flashtap-staging.llosperofficial.workers.dev
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/probe-attempt-started-http-staging.ts

  probe-webhook-sig-fallback:
    if: contains(github.event.head_commit.message, '[probe-webhook-sig-fallback]')
    runs-on: ubuntu-latest
    needs: deploy
    name: Probe webhook sig-fail Finatic fallback
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Invalid-signature webhook to Finatic fallback (paid/not_paid/unreachable)
        env:
          STAGING_WORKER_URL: https://flashtap-staging.llosperofficial.workers.dev
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/probe-webhook-sig-fallback-staging.ts

  investigate-uat-1199:
    if: contains(github.event.head_commit.message, '[investigate-uat-1199]')
    runs-on: ubuntu-latest
    name: Investigate Finatic-UAT NAD 11.99 decline (read-only)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Dump order + audit_logs for ~11.99 @ 14:18 UTC
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/investigate-uat-1199-payment-staging.ts

  investigate-uat-1199-followup:
    if: contains(github.event.head_commit.message, '[investigate-uat-1199-followup]')
    runs-on: ubuntu-latest
    name: Follow-up Finatic-UAT 11.99 decline dump (read-only)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Expand nearby orders + decline audits
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/investigate-uat-1199-followup-staging.ts

  probe-order67-cron:
    if: contains(github.event.head_commit.message, '[probe-order67-cron]')
    runs-on: ubuntu-latest
    name: Probe order #67 cron/Finatic sticky-pending (staging)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: CRON_SECRET presence + Finatic query + autoCancel simulation
        env:
          STAGING_WORKER_URL: https://flashtap-staging.llosperofficial.workers.dev
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_CRON_SECRET: ${{ secrets.STAGING_CRON_SECRET }}
          CRON_SECRET: ${{ secrets.STAGING_CRON_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx tsx scripts/probe-order67-cron-staging.ts

  verify-staging-hardening:
    if: contains(github.event.head_commit.message, '[verify-staging-hardening]')
    runs-on: ubuntu-latest
    name: Verify tracker + security hardening (staging)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: HTTP + service-role verification
        env:
          STAGING_WORKER_URL: https://flashtap-staging.llosperofficial.workers.dev
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          npx tsx scripts/verify-staging-hardening.ts
          npx tsx scripts/apply-realtime-orders-staging.ts || true

  verify-document-engine:
    # Runs after DDL is applied (SQL editor or credentials). Does not apply DDL.
    if: contains(github.event.head_commit.message, '[verify-document-engine]')
    runs-on: ubuntu-latest
    name: Verify Document Engine (staging service-role)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Functional verify (assumes migration already applied)
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/verify-document-engine-staging.ts

  apply-document-engine:
    # One-shot DDL apply when a credential secret exists. Repo currently has none of
    # SUPABASE_ACCESS_TOKEN / STAGING_DATABASE_URL / STAGING_SUPABASE_DB_PASSWORD —
    # paste scripts/sql/apply-20260725200000-document-engine.sql in the staging SQL
    # editor, then push with [verify-document-engine].
    if: contains(github.event.head_commit.message, '[apply-document-engine]')
    runs-on: ubuntu-latest
    name: Apply Document Engine migration (staging)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Probe apply credentials (no values printed)
        run: |
          has_token=0; has_db_url=0; has_db_password=0
          [ -n "$SUPABASE_ACCESS_TOKEN" ] && has_token=1
          [ -n "$STAGING_DATABASE_URL$DATABASE_URL$SUPABASE_DB_URL" ] && has_db_url=1
          [ -n "$STAGING_SUPABASE_DB_PASSWORD$SUPABASE_DB_PASSWORD" ] && has_db_password=1
          echo "Credential probe: token=$has_token db_url=$has_db_url db_password=$has_db_password"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          STAGING_SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Apply Document Engine migration on staging
        run: |
          set -euo pipefail
          MIG=supabase/migrations/20260725200000_document_engine_credit_notes_lineage.sql
          VER=20260725200000
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Using SUPABASE_ACCESS_TOKEN + linked Management API"
            npx tsx scripts/apply-document-engine-staging.ts
            exit 0
          fi
          DB_URL="${STAGING_DATABASE_URL:-${DATABASE_URL:-${SUPABASE_DB_URL:-}}}"
          if [ -n "$DB_URL" ]; then
            echo "Using database URL with supabase db query --db-url"
            npx supabase db query --db-url "$DB_URL" -f "$MIG"
            npx supabase db query --db-url "$DB_URL" "INSERT INTO supabase_migrations.schema_migrations(version) VALUES ('$VER') ON CONFLICT DO NOTHING"
            echo "APPLY_DOCUMENT_ENGINE_STAGING_OK (db-url)"
            exit 0
          fi
          DB_PASSWORD="${STAGING_SUPABASE_DB_PASSWORD:-${SUPABASE_DB_PASSWORD:-}}"
          if [ -n "$DB_PASSWORD" ]; then
            echo "Using DB password + supabase link"
            npx supabase link --project-ref mdqjpxwczrhkxkbqatqa -p "$DB_PASSWORD" --yes
            npx tsx scripts/safe-supabase-linked.ts mdqjpxwczrhkxkbqatqa db query --linked -f "$MIG"
            npx tsx scripts/safe-supabase-linked.ts mdqjpxwczrhkxkbqatqa migration repair --linked --status applied "$VER"
            echo "APPLY_DOCUMENT_ENGINE_STAGING_OK (password)"
            exit 0
          fi
          echo "ERROR: No way to apply DDL. Add one of:"
          echo "  - SUPABASE_ACCESS_TOKEN (preferred)"
          echo "  - STAGING_DATABASE_URL / DATABASE_URL"
          echo "  - STAGING_SUPABASE_DB_PASSWORD"
          echo "Or paste $MIG into the Supabase SQL editor for staging."
          exit 1
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          STAGING_SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Verify schema + correct_invoice flows
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          STAGING_SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          # verify script needs linked CLI for information_schema queries
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            npx tsx scripts/verify-document-engine-staging.ts
            exit 0
          fi
          DB_PASSWORD="${STAGING_SUPABASE_DB_PASSWORD:-${SUPABASE_DB_PASSWORD:-}}"
          if [ -n "$DB_PASSWORD" ]; then
            npx supabase link --project-ref mdqjpxwczrhkxkbqatqa -p "$DB_PASSWORD" --yes
            npx tsx scripts/verify-document-engine-staging.ts
            exit 0
          fi
          # Service-role-only subset when CLI link unavailable
          npx tsx scripts/verify-document-engine-staging.ts

  build-verification:
    runs-on: ubuntu-latest
    name: Build Verification (Lint, Typecheck, Unit Tests)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      # Runs before `npm ci` so node_modules cannot pollute the scan.
      # #142: conflict markers sat in a JSDoc block for days because neither the build nor
      # typecheck could see them. Catches a class of error typecheck structurally cannot.
      - name: Reject committed conflict markers
        run: |
          set -euo pipefail
          if grep -rnE '^(<<<<<<<|>>>>>>>)' app lib components workers; then
            echo "ERROR: merge conflict markers are committed (listed above)."
            exit 1
          fi
          echo "No conflict markers found."
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      # Before `npm ci` because it needs nothing but node and the checkout. See #212 — the scan
      # is statement-oriented, not line-oriented, because every real hit in this repo puts the
      # CHECK on a continuation line where a grep would find none of them.
      - name: Reject inline CHECK on ADD COLUMN IF NOT EXISTS
        run: node scripts/check-migration-inline-checks.mjs
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npx eslint . --max-warnings=0
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit and schema tests (no HTTP)
        run: npx jest --ci --forceExit --testPathPattern="schema-constraints|supabase-schema|payment|realtime|apk-terminal|capabilities|migration-inline-check-lint"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Check migration drift (staging DB vs supabase/migrations)
        # Non-blocking for now: staging has known pre-existing drift (see #20/#38
        # investigation) that needs its own reviewed cleanup pass before this can
        # safely gate deploys. Surfaces the mismatch visibly without blocking.
        continue-on-error: true
        run: node scripts/check-migration-drift.mjs
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      - name: Recipe deduction idempotency tests (staging Supabase)
        run: npx jest --ci --forceExit --testPathPattern="recipe-deduction"
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      - name: Staging authorize tests (staging Supabase)
        run: npx jest --ci --forceExit --maxWorkers=1 --testPathPattern="authorize-|staff-role"
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-verification
    name: Deploy to Cloudflare Workers
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build with OpenNext
        run: npx @opennextjs/cloudflare@1.20.1 build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: https://flashtap-staging.llosperofficial.workers.dev
          NEXT_PUBLIC_BASE_URL: https://flashtap-staging.llosperofficial.workers.dev
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
          GIT_COMMIT_SHA: ${{ github.sha }}
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      - name: Set Cloudflare worker secrets
        run: |
          if [ -n "$CRON_SECRET" ]; then
            echo "$CRON_SECRET" | npx wrangler@3.99.0 secret put CRON_SECRET
          else
            echo "WARNING: STAGING_CRON_SECRET not set — expire-pending will reject all callers until configured"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CRON_SECRET: ${{ secrets.STAGING_CRON_SECRET }}
      - name: Deploy to Cloudflare Workers
        run: npx wrangler@3.99.0 deploy --var GIT_COMMIT_SHA:${{ github.sha }} --var NEXT_PUBLIC_COMMIT_SHA:${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deployment-verification:
    runs-on: ubuntu-latest
    needs: deploy
    name: Deployment Verification (Smoke + Integration + E2E)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Smoke tests
        run: |
          sleep 10
          curl -f https://flashtap-staging.llosperofficial.workers.dev/ || exit 1
          curl -f https://flashtap-staging.llosperofficial.workers.dev/api/menu/ade55dd9-ab0d-46c7-9f53-d65f4bed4305/features || exit 1
          echo "Smoke tests passed"
      - name: Integration tests (HTTP)
        run: npx jest --ci --forceExit __tests__/permissions.test.ts __tests__/web-routing.test.ts
        env:
          FLASHTAP_BASE_URL: https://flashtap-staging.llosperofficial.workers.dev
          RIVIERA_URL: https://riviera.flashtap.app
      - name: Staging authorize tests (staging Supabase)
        run: npx jest --ci --forceExit --maxWorkers=1 --testPathPattern="authorize-|staff-role"
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      - name: Ensure E2E kiosk fixture
        run: node scripts/ensure-e2e-kiosk-fixture.mjs
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          E2E_BASE_URL: https://flashtap-staging.llosperofficial.workers.dev
      - name: Playwright E2E tests
        run: npm run test:e2e
        env:
          E2E_BASE_URL: https://flashtap-staging.llosperofficial.workers.dev
