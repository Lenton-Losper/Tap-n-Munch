name: Deploy to Cloudflare Staging

on:
  push:
    branches:
      - cloudflare-staging

jobs:
  apply-platform-ops-migration:
    # One-shot: remove after staging (+ optional prod) schema is confirmed.
    if: contains(github.event.head_commit.message, '[apply-ops-migration]')
    runs-on: ubuntu-latest
    name: Apply platform ops console migration
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Probe apply credentials (no values printed)
        id: creds
        run: |
          has_token=0
          has_db_url=0
          has_db_password=0
          [ -n "$SUPABASE_ACCESS_TOKEN" ] && has_token=1
          [ -n "$STAGING_DATABASE_URL$DATABASE_URL$SUPABASE_DB_URL" ] && has_db_url=1
          [ -n "$STAGING_SUPABASE_DB_PASSWORD$SUPABASE_DB_PASSWORD" ] && has_db_password=1
          echo "has_token=$has_token" >> "$GITHUB_OUTPUT"
          echo "has_db_url=$has_db_url" >> "$GITHUB_OUTPUT"
          echo "has_db_password=$has_db_password" >> "$GITHUB_OUTPUT"
          echo "Credential probe: token=$has_token db_url=$has_db_url db_password=$has_db_password"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          STAGING_SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Try exec_sql RPC on staging (service role)
        id: exec_sql
        continue-on-error: true
        run: |
          node <<'NODE'
          const fs = require('fs')
          const { createClient } = require('@supabase/supabase-js')
          const sql = fs.readFileSync('supabase/migrations/20260724180000_platform_ops_console.sql', 'utf8')
          const supabase = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY, {
            auth: { autoRefreshToken: false, persistSession: false },
          })
          ;(async () => {
            for (const args of [{ sql }, { query: sql }, { p_sql: sql }]) {
              const { data, error } = await supabase.rpc('exec_sql', args)
              console.log('exec_sql attempt', Object.keys(args)[0], error ? error.message : 'ok', data ?? '')
              if (!error) {
                // Record migration as applied via RPC if available
                const repair = await supabase.rpc('exec_sql', {
                  sql: "INSERT INTO supabase_migrations.schema_migrations(version) VALUES ('20260724180000') ON CONFLICT DO NOTHING",
                })
                console.log('repair', repair.error ? repair.error.message : 'ok')
                process.exit(0)
              }
            }
            process.exit(2)
          })().catch((e) => { console.error(e); process.exit(1) })
          NODE
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      - name: Apply migration on staging (Management API / db-url)
        if: steps.exec_sql.outcome != 'success'
        run: |
          set -euo pipefail
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Using SUPABASE_ACCESS_TOKEN + linked Management API"
            npx tsx scripts/apply-platform-ops-console-staging.ts
            exit 0
          fi
          DB_URL="${STAGING_DATABASE_URL:-${DATABASE_URL:-${SUPABASE_DB_URL:-}}}"
          if [ -n "$DB_URL" ]; then
            echo "Using database URL with supabase db query --db-url"
            npx supabase db query --db-url "$DB_URL" -f supabase/migrations/20260724180000_platform_ops_console.sql
            npx supabase db query --db-url "$DB_URL" "INSERT INTO supabase_migrations.schema_migrations(version) VALUES ('20260724180000') ON CONFLICT DO NOTHING"
            echo "APPLY_PLATFORM_OPS_CONSOLE_STAGING_OK (db-url)"
            exit 0
          fi
          DB_PASSWORD="${STAGING_SUPABASE_DB_PASSWORD:-${SUPABASE_DB_PASSWORD:-}}"
          if [ -n "$DB_PASSWORD" ]; then
            echo "Using DB password + supabase link"
            npx supabase link --project-ref mdqjpxwczrhkxkbqatqa -p "$DB_PASSWORD" --yes
            npx tsx scripts/safe-supabase-linked.ts mdqjpxwczrhkxkbqatqa db query --linked -f supabase/migrations/20260724180000_platform_ops_console.sql
            npx tsx scripts/safe-supabase-linked.ts mdqjpxwczrhkxkbqatqa migration repair --linked --status applied 20260724180000
            echo "APPLY_PLATFORM_OPS_CONSOLE_STAGING_OK (password)"
            exit 0
          fi
          echo "ERROR: No way to apply DDL. Add one of:"
          echo "  - SUPABASE_ACCESS_TOKEN (preferred)"
          echo "  - STAGING_DATABASE_URL / DATABASE_URL"
          echo "  - STAGING_SUPABASE_DB_PASSWORD"
          echo "Or paste supabase/migrations/20260724180000_platform_ops_console.sql into the Supabase SQL editor."
          exit 1
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          STAGING_SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Apply migration on production
        if: contains(github.event.head_commit.message, '[apply-ops-migration-prod]')
        run: |
          set -euo pipefail
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            npx tsx scripts/apply-platform-ops-console-production.ts
            exit 0
          fi
          DB_URL="${PRODUCTION_DATABASE_URL:-${DATABASE_URL:-${SUPABASE_DB_URL:-}}}"
          if [ -n "$DB_URL" ]; then
            npx supabase db query --db-url "$DB_URL" -f supabase/migrations/20260724180000_platform_ops_console.sql
            npx supabase db query --db-url "$DB_URL" "INSERT INTO supabase_migrations.schema_migrations(version) VALUES ('20260724180000') ON CONFLICT DO NOTHING"
            echo "APPLY_PLATFORM_OPS_CONSOLE_PRODUCTION_OK (db-url)"
            exit 0
          fi
          DB_PASSWORD="${PRODUCTION_SUPABASE_DB_PASSWORD:-${SUPABASE_DB_PASSWORD:-}}"
          if [ -n "$DB_PASSWORD" ]; then
            npx supabase link --project-ref ihlmmpmolnpchzgwyhgh -p "$DB_PASSWORD" --yes
            npx tsx scripts/safe-supabase-linked.ts ihlmmpmolnpchzgwyhgh db query --linked -f supabase/migrations/20260724180000_platform_ops_console.sql
            npx tsx scripts/safe-supabase-linked.ts ihlmmpmolnpchzgwyhgh migration repair --linked --status applied 20260724180000
            echo "APPLY_PLATFORM_OPS_CONSOLE_PRODUCTION_OK (password)"
            exit 0
          fi
          echo "ERROR: No production DDL credentials available."
          exit 1
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PRODUCTION_SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  build-verification:
    runs-on: ubuntu-latest
    name: Build Verification (Lint, Typecheck, Unit Tests)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npx eslint . --max-warnings=0
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit and schema tests (no HTTP)
        run: npx jest --ci --forceExit --testPathPattern="schema-constraints|supabase-schema|payment|realtime|apk-terminal|capabilities"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Check migration drift (staging DB vs supabase/migrations)
        # Non-blocking for now: staging has known pre-existing drift (see #20/#38
        # investigation) that needs its own reviewed cleanup pass before this can
        # safely gate deploys. Surfaces the mismatch visibly without blocking.
        continue-on-error: true
        run: node scripts/check-migration-drift.mjs
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      - name: Recipe deduction idempotency tests (staging Supabase)
        run: npx jest --ci --forceExit --testPathPattern="recipe-deduction"
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      - name: Staging authorize tests (staging Supabase)
        run: npx jest --ci --forceExit --maxWorkers=1 --testPathPattern="authorize-|staff-role"
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-verification
    name: Deploy to Cloudflare Workers
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build with OpenNext
        run: npx @opennextjs/cloudflare@1.20.1 build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: https://flashtap-staging.llosperofficial.workers.dev
          NEXT_PUBLIC_BASE_URL: https://flashtap-staging.llosperofficial.workers.dev
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
          GIT_COMMIT_SHA: ${{ github.sha }}
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      - name: Set Cloudflare worker secrets
        run: |
          if [ -n "$CRON_SECRET" ]; then
            echo "$CRON_SECRET" | npx wrangler@3.99.0 secret put CRON_SECRET
          else
            echo "WARNING: STAGING_CRON_SECRET not set — expire-pending will reject all callers until configured"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CRON_SECRET: ${{ secrets.STAGING_CRON_SECRET }}
      - name: Deploy to Cloudflare Workers
        run: npx wrangler@3.99.0 deploy --var GIT_COMMIT_SHA:${{ github.sha }} --var NEXT_PUBLIC_COMMIT_SHA:${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deployment-verification:
    runs-on: ubuntu-latest
    needs: deploy
    name: Deployment Verification (Smoke + Integration + E2E)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Smoke tests
        run: |
          sleep 10
          curl -f https://flashtap-staging.llosperofficial.workers.dev/ || exit 1
          curl -f https://flashtap-staging.llosperofficial.workers.dev/api/menu/ade55dd9-ab0d-46c7-9f53-d65f4bed4305/features || exit 1
          echo "Smoke tests passed"
      - name: Integration tests (HTTP)
        run: npx jest --ci --forceExit __tests__/permissions.test.ts __tests__/web-routing.test.ts
        env:
          FLASHTAP_BASE_URL: https://flashtap-staging.llosperofficial.workers.dev
          RIVIERA_URL: https://riviera.flashtap.app
      - name: Staging authorize tests (staging Supabase)
        run: npx jest --ci --forceExit --maxWorkers=1 --testPathPattern="authorize-|staff-role"
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      - name: Ensure E2E kiosk fixture
        run: node scripts/ensure-e2e-kiosk-fixture.mjs
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          E2E_BASE_URL: https://flashtap-staging.llosperofficial.workers.dev
      - name: Playwright E2E tests
        run: npm run test:e2e
        env:
          E2E_BASE_URL: https://flashtap-staging.llosperofficial.workers.dev
