name = "flashtap-staging"
main = "workers/flashtap-worker.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
ENVIRONMENT = "staging"
NEXT_PUBLIC_SUPABASE_URL = "https://mdqjpxwczrhkxkbqatqa.supabase.co"
NEXT_PUBLIC_APP_URL = "https://flashtap-staging.llosperofficial.workers.dev"

# Backstop for abandoned Sale-tab POS orders (and hosted expiry after Part 3).
# Hits POST /api/cron/cleanup-stale-orders via workers/flashtap-worker.ts scheduled().
[triggers]
crons = ["*/2 * * * *"]

[[kv_namespaces]]
binding = "NEXT_CACHE_WORKERS_KV"
id = "c12172a326a94cc39e874eb2e7cd9a69"

# #241 - rate limit for POST /api/terminals/activate, the one unauthenticated route that mints a
# terminal JWT (that token carries orders:update, which gates settle / table close / mark-paid).
#
# Edge-level and NOT a database counter, for a reason that is not a preference: a FAILED activation
# knows no restaurant, and both audit tables declare restaurant_id NOT NULL - so the attempt most
# worth recording is the one they cannot hold. A row per attempt would also turn a guessing attack
# into write amplification against our own database.
#
# namespace_id is an arbitrary but STABLE identifier for this limiter. Changing it silently resets
# every counter, so treat it as fixed once deployed.
[[unsafe.bindings]]
name = "ACTIVATION_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# #348 - rate limit for POST /api/crash-reports, the unauthenticated intake that makes the error
# boundaries' signed line "We have been sent the details automatically" true. It has to be open:
# a customer whose screen has just crashed has no account to have a session for.
#
# THE LIMIT IS PER VENUE, NOT PER PERSON. A room's customers share one NAT'd public IP, so
# CF-Connecting-IP buckets a whole venue. The failure this endpoint exists to capture is a deploy
# that breaks a render path, which crashes everyone in the room inside the same minute - so the
# incident and a flood look identical from the key's point of view, and of the two, silently
# dropping the incident is the worse outcome. Hence 30 and not activation's 5.
#
# namespace_id is an arbitrary but STABLE identifier for this limiter. Changing it silently resets
# every counter, so treat it as fixed once deployed. 1001 is taken by ACTIVATION_RATE_LIMITER.
[[unsafe.bindings]]
name = "CRASH_REPORT_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 30, period = 60 }
