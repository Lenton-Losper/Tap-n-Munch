name = "flashtap-staging"
main = "workers/flashtap-worker.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
ENVIRONMENT = "staging"
NEXT_PUBLIC_SUPABASE_URL = "https://mdqjpxwczrhkxkbqatqa.supabase.co"
NEXT_PUBLIC_APP_URL = "https://flashtap-staging.llosperofficial.workers.dev"

# Backstop for abandoned Sale-tab POS orders (and hosted expiry after Part 3).
# Hits POST /api/cron/cleanup-stale-orders via workers/flashtap-worker.ts scheduled().
[triggers]
crons = ["*/2 * * * *"]

[[kv_namespaces]]
binding = "NEXT_CACHE_WORKERS_KV"
id = "c12172a326a94cc39e874eb2e7cd9a69"
